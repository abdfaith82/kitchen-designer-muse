name: Android CI

# Builds the debug APK on every push / pull request.
# Uses the Gradle distribution directly (gradle-version 8.9) because
# gradle-wrapper.jar is not committed yet — Android Studio generates it
# on first open; once it exists, switch the build step to ./gradlew.
# Unity is NOT built here: unity/ is source only, and the app module
# builds without the optional :unityLibrary module.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
